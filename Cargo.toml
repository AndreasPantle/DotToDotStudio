[package]
name = "DotToDotStudio"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.34.3"
egui = "0.34.3"
image = "0.25.10"
rfd = "0.17.2"
rusqlite = { version = "0.40.0", features = ["bundled"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
