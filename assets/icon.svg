<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b3242"/>
      <stop offset="100%" stop-color="#1a1f29"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- connecting lines (star path, drawn in dot order) -->
  <polyline
    points="256,90 314,230 462,238 344,326 388,470 256,384 124,470 168,326 50,238 198,230 256,90"
    fill="none"
    stroke="#78b4ff"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"/>

  <!-- dots + numbers, in connection order -->
  <g font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" text-anchor="middle">
    <g>
      <circle cx="256" cy="90" r="26" fill="#78b4ff"/>
      <text x="256" y="100" fill="#1a1f29">1</text>
    </g>
    <g>
      <circle cx="462" cy="238" r="26" fill="#78b4ff"/>
      <text x="462" y="248" fill="#1a1f29">2</text>
    </g>
    <g>
      <circle cx="388" cy="470" r="26" fill="#78b4ff"/>
      <text x="388" y="480" fill="#1a1f29">3</text>
    </g>
    <g>
      <circle cx="124" cy="470" r="26" fill="#78b4ff"/>
      <text x="124" y="480" fill="#1a1f29">4</text>
    </g>
    <g>
      <circle cx="50" cy="238" r="26" fill="#78b4ff"/>
      <text x="50" y="248" fill="#1a1f29">5</text>
    </g>
  </g>
</svg>
